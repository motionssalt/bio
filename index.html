<!doctype html>

    <meta name="description" content="Premium creative portfolio for Victor (MOTIONSALT) — Kinetic video editing, motion design, AMV cuts, and high-impact graphic design. Available for commission." />
    
    <!-- Theme pre-paint script to prevent theme flash -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('motionssalt_theme');
          var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) metaTheme.setAttribute('content', theme === 'dark' ? '#050505' : '#fafafa');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <meta name="theme-color" content="#050505" />
    <link rel="canonical" href="https://motionssalt-portfolio.pages.dev/" />
