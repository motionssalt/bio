<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Frame Not Found | MOTIONSALT</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@700&display=swap" />
    <style>
      :root {
        --bg: #050505;
        --text: #ffffff;
        --text-muted: rgba(255, 255, 255, 0.6);
        --accent: #3b82f6;
      }
      body {
        margin: 0;
        background-color: var(--bg);
        color: var(--text);
        font-family: 'Inter', system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 1.5rem;
      }
      .container {
        max-width: 480px;
      }
      h1 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 5rem;
        margin: 0;
        letter-spacing: -0.05em;
        line-height: 1;
        color: var(--accent);
      }
      h2 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 1.5rem;
        margin: 1rem 0 0.5rem;
      }
      p {
        font-size: 0.95rem;
        color: var(--text-muted);
        line-height: 1.6;
        margin-bottom: 2rem;
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1.5rem;
        font-size: 0.85rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        background-color: var(--accent);
        color: #ffffff;
        border-radius: 0.75rem;
        text-decoration: none;
        transition: opacity 0.2s;
      }
      a:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>404</h1>
      <h2>Frame Lost in Transit</h2>
      <p>The page or project edit you are seeking has been moved, re-rendered, or does not exist in the active catalogue.</p>
      <a href="/">Return to MOTIONSALT Reel</a>
    </div>
  </body>
</html>
